name: verification

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # git-version derives the plugin version from tags
          fetch-depth: 0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      # check = checkstyle + test. The GCP-backed tests run only when these
      # repository secrets are set; missing secrets arrive as empty strings and
      # the tests treat those as "not set" and skip.
      - run: ./gradlew check
        env:
          GCP_EMAIL: ${{ secrets.GCP_EMAIL }}
          GCP_JSON_KEYFILE: ${{ secrets.GCP_JSON_KEYFILE }}
          GCP_PRIVATE_KEYFILE: ${{ secrets.GCP_PRIVATE_KEYFILE }}
          GCP_BUCKET: ${{ secrets.GCP_BUCKET }}
          GCP_BUCKET_DIRECTORY: ${{ secrets.GCP_BUCKET_DIRECTORY }}
